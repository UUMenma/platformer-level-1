<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Digital prototype: 2D platformer level 1 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer Adventure</title>
    <!-- Tailwind CSS for page styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            border: 4px solid #4a5568;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            background-color: #87CEEB; /* Sky blue background */
        }
    </style>
</head>
<body>
    <!-- Game container -->
    <div id="game-container"></div>

    <script>
        // Phaser configuration
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 800 },
                    debug: false // Set to true to display physics hitboxes
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // Global game variables
        let player;
        let cursors;
        let spaceKey;
        let platforms;
        let spikes;
        let star;
        let diamond;
        let boosters; // Group for multiple boosters
        
        // Combo jump logic variables
        let lastLandTime = 0;
        let wasOnGround = true;
        let canCombo = false;

        let isGameOver = false;

        function preload() {
            // Generate textures programmatically 
            let g = this.make.graphics({x: 0, y: 0, add: false});

            // 1. Player texture (blue square, 32x32)
            g.fillStyle(0x3b82f6); // Tailwind blue-500
            g.fillRect(0, 0, 32, 32);
            g.generateTexture('player', 32, 32);
            g.clear();

            // 2. Platform block texture (40x40, brown with green grass)
            g.fillStyle(0x654321); // Brown
            g.fillRect(0, 0, 40, 40);
            g.fillStyle(0x4ade80); // Grass green
            g.fillRect(0, 0, 40, 8);
            g.generateTexture('block', 40, 40);
            g.clear();

            // 3. Spike texture (connected triangles)
            g.fillStyle(0x808080); // Gray
            g.beginPath();

            // First spike (covers the left half: 0 to 20px)
            g.moveTo(10, 10);  // Tip
            g.lineTo(20, 20);  // Bottom-right corner
            g.lineTo(0, 20);   // Bottom-left corner

            // Second spike (covers the right half: 20 to 40px)
            g.moveTo(30, 10);  // Tip
            g.lineTo(40, 20);  // Bottom-right corner
            g.lineTo(20, 20);  // Bottom-left corner

            g.closePath();
            g.fill();
            g.generateTexture('spike', 40, 20);
            g.clear();

            // 4. Star texture (40x40)
            g.fillStyle(0xfacc15); // Yellow
            g.beginPath();
            g.moveTo(20, 0); g.lineTo(26, 14); g.lineTo(40, 14); g.lineTo(29, 23);
            g.lineTo(33, 40); g.lineTo(20, 30); g.lineTo(7, 40); g.lineTo(11, 23);
            g.lineTo(0, 14); g.lineTo(14, 14); 
            g.closePath();
            g.fill();
            g.generateTexture('star', 40, 40);
            g.clear();

            // 5. Diamond texture (40x40)
            g.fillStyle(0x22d3ee); // Cyan
            g.beginPath();
            g.moveTo(20, 0); g.lineTo(40, 20); g.lineTo(20, 40); g.lineTo(0, 20);
            g.closePath();
            g.fill();
            g.generateTexture('diamond', 40, 40);
            g.clear();

            // 6. Booster texture (40x10)
            g.fillStyle(0x22c55e); // Bright green
            g.fillRect(0, 0, 40, 10);
            g.generateTexture('booster', 40, 10);
            g.clear();
        }

        function create() {
            isGameOver = false;
            
            // Background color 
            this.cameras.main.setBackgroundColor('#87CEEB');

            // Decorative background clouds
            let graphics = this.add.graphics();
            graphics.fillStyle(0xffffff, 0.8);
            graphics.fillCircle(200, 150, 30); graphics.fillCircle(230, 150, 40); graphics.fillCircle(260, 150, 30);
            graphics.fillCircle(700, 100, 40); graphics.fillCircle(740, 100, 50); graphics.fillCircle(780, 100, 40);
            graphics.fillCircle(1200, 180, 35); graphics.fillCircle(1240, 180, 45); graphics.fillCircle(1280, 180, 35);
            graphics.fillCircle(1800, 120, 30); graphics.fillCircle(1830, 120, 40); graphics.fillCircle(1860, 120, 30);

            // Dark background for the final expert section
            let bgDark = this.add.graphics();
            bgDark.fillStyle(0x1a202c, 1);
            bgDark.fillRect(1500, 0, 1000, 600); // Covers section 3
            bgDark.setDepth(-1); // Keeps it behind all objects

            // Physics groups
            platforms = this.physics.add.staticGroup();
            spikes = this.physics.add.staticGroup();
            boosters = this.physics.add.staticGroup();

            // ==========================================
            // LEVEL CONSTRUCTION (block = 40x40 px)
            // ==========================================
            
            // Helper function to create platforms with n blocks of width
            const createPlat = (startX, y, blocks) => {
                for(let i=0; i<blocks; i++) {
                    // +20 because the Phaser texture origin is centered (20,20)
                    platforms.create(startX + (i * 40) + 20, y + 20, 'block');
                }
            };
            
            // Helper function for spikes (hitbox adjusted for jump physics)
            const createSpikes = (startX, y, blocks) => {
                for(let i=0; i<blocks; i++) {
                    let s = spikes.create(startX + (i * 40) + 20, y - 10, 'spike');
                    
                    // Reduce the collision box (hitbox)
                    // The active hazard area is only 8px wide and 6px high
                    // and is placed at the center of the spike block.
                    s.body.setSize(8, 6);
                    s.body.setOffset(16, 14);
                }
            };

            // --- SECTION 1: INTRODUCTION ---
            // Safe floor to prevent falling during the introduction
            createPlat(0, 560, 20); // 20 blocks (x: 0 to 800)

            // Lower boosters in case the player falls
            boosters.create(225, 555, 'booster'); 

            // Main platforms (y=400)
            createPlat(0, 400, 5);      // Starting floor: 5 blocks (x: 0-200)
            createPlat(280, 400, 2);    // Gap (2) -> Platform 1: 2 blocks (x: 280-360)
            createPlat(440, 400, 1);    // Gap (2) -> Platform 2: 1 block (x: 440-480)
            createPlat(600, 400, 5);    // Gap (3) -> Final floor: 5 blocks (x: 600-800)

            // --- SECTION 2: HAZARDS ---
            // Starts at x=800 (direct continuation)
            // Normal floor (3), spikes (2), normal floor (3)
            createPlat(800, 400, 8); 
            createSpikes(920, 400, 1);  // Spikes above blocks 4 and 5

            // Gap / void (2 blocks -> x: 1120 to 1200)
            
            // Normal floor (3), spikes (2), normal floor (3)
            createPlat(1200, 400, 8);
            createSpikes(1320, 400, 1); // Spikes above blocks 4 and 5

            // --- SECTION 3: ALTERNATIVE PATHS ---
            // Starts at x=1520
            
            // Normal path (y=400)
            createPlat(1520, 400, 5);   // Starting floor: 5 blocks (x: 1520-1720)
            
            // Booster placed on the third block of the normal starting floor
            boosters.create(1620, 395, 'booster'); 
            
            createPlat(1800, 400, 3);   // Gap (2) -> Platform 1: 3 blocks (x: 1800-1920)
            createPlat(2000, 400, 3);   // Gap (2) -> Platform 2: 3 blocks (x: 2000-2120)
            createPlat(2200, 400, 5);   // Gap (2) -> Final floor: 5 blocks (x: 2200-2400)
            
            // Yellow star at the end of the normal path
            star = this.physics.add.staticSprite(2360, 380, 'star');

            // Expert path (y=200)
            // Starts after using the booster (x=1680)
            createPlat(1680, 200, 2);   // Starting floor: 2 blocks (x: 1680-1760)
            createPlat(1840, 200, 1);   // Gap (2) -> Platform 1: 1 block (x: 1840-1880)
            createPlat(2000, 200, 5);   // Gap (3) -> Final floor: 5 blocks (x: 2000-2200)
            
            // Blue diamond at the end of the expert path
            diamond = this.physics.add.staticSprite(2160, 180, 'diamond');
            // Note: After collecting the diamond at x=2200, the player falls to the normal floor at x=2200.

            // ==========================================
            // PLAYER AND PHYSICS
            // ==========================================
            player = this.physics.add.sprite(60, 350, 'player');
            player.setBounce(0);
            
            // World bounds (the lower edge is open so the player can fall through gaps)
            this.physics.world.setBounds(0, 0, 2500, 1000);
            this.cameras.main.setBounds(0, 0, 2500, 600);
            this.cameras.main.startFollow(player, true, 0.08, 0.08);

            // Controls
            cursors = this.input.keyboard.createCursorKeys();
            spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

            // Collisions
            this.physics.add.collider(player, platforms);
            
            // Spike collision -> restart level
            this.physics.add.collider(player, spikes, hitObstacle, null, this);
            
            // Booster overlap (launch pads)
            this.physics.add.overlap(player, boosters, triggerBooster, null, this);
            
            // Collectible overlaps
            this.physics.add.overlap(player, star, collectStar, null, this);
            this.physics.add.overlap(player, diamond, collectDiamond, null, this);
        }

        function update(time, delta) {
            if (isGameOver) return;

            // Prevent the player from leaving the map on the left
            if (player.x < 16) player.x = 16;
            
            // Falling into the void -> restart level
            if (player.y > 650) {
                hitObstacle.call(this);
            }

            // Horizontal movement
            const speed = 135;
            if (cursors.left.isDown) {
                player.setVelocityX(-speed);
            } else if (cursors.right.isDown) {
                player.setVelocityX(speed);
            } else {
                player.setVelocityX(0);
            }

            // --- JUMP AND COMBO-JUMP LOGIC ---
            const onGround = player.body.blocked.down || player.body.touching.down;
            const jumpPressed = Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(spaceKey);
            
            // Detect the exact moment the player lands
            if (onGround && !wasOnGround) {
                lastLandTime = time;
            }
            wasOnGround = onGround;

            // Jumping is only allowed while the player is on the ground
            if (jumpPressed && onGround) {
                let timeSinceLand = time - lastLandTime;
                
                // If the player jumps shortly after landing (less than 250ms) and the combo is ready
                if (timeSinceLand < 250 && canCombo) {
                    player.setVelocityY(-480); // Combo jump (3 blocks)
                    canCombo = false;          // Consume the combo; the next jump will be normal
                    
                    player.setTint(0xffea00);  // Gold visual effect
                    this.time.delayedCall(400, () => { if(player) player.clearTint(); });
                } else {
                    player.setVelocityY(-250); // Normal jump (2 blocks)
                    canCombo = true;           // Prepare the combo for the next landing
                }
            }
        }

        function hitObstacle(playerObj, spikeObj) {
            if(isGameOver) return;
            isGameOver = true;
            this.physics.pause();
            player.setTint(0xff0000);
            
            // Short delay before restarting
            this.time.delayedCall(500, () => {
                this.scene.restart();
            });
        }

        function triggerBooster(playerObj, boosterObj) {
            // Launch only when the player is falling onto the booster
            if (playerObj.body.velocity.y >= 0) {
                playerObj.setVelocityY(-650); // Large jump toward the expert path
            }
        }

        function collectStar(playerObj, starObj) {
            if(isGameOver) return;
            isGameOver = true;
            this.physics.pause();
            starObj.destroy();
            
            // Victory message
            const cam = this.cameras.main;
            const winText = this.add.text(cam.scrollX + 400, 300, 'LEVEL COMPLETED!', {
                fontSize: '48px',
                fill: '#ffffff',
                fontStyle: 'bold',
                stroke: '#000000',
                strokeThickness: 6
            });
            winText.setOrigin(0.5);
            
            // Particle/flash effect (simulated with a brief camera flash)
            this.cameras.main.flash(1000, 255, 215, 0);
        }

        function collectDiamond(playerObj, diamondObj) {
            diamondObj.destroy();
            this.cameras.main.flash(300, 0, 255, 255);
            
            // Display floating +500 points
            const floatText = this.add.text(playerObj.x, playerObj.y - 40, '+500', {
                fontSize: '20px',
                fill: '#00ffff',
                stroke: '#000',
                strokeThickness: 3
            }).setOrigin(0.5);

            this.tweens.add({
                targets: floatText,
                y: playerObj.y - 80,
                alpha: 0,
                duration: 1000,
                onComplete: () => floatText.destroy()
            });
        }
    </script>
</body>
</html>
