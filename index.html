<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Digital prototype: 2D platformer level 1 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer Adventure</title>
    <!-- Tailwind CSS para el diseno de la pagina -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            border: 4px solid #4a5568;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            background-color: #87CEEB; /* Fondo azul cielo */
        }
        .instructions {
            max-width: 800px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Contenedor del juego -->
    <div id="game-container"></div>

    <script>
        // Configuracion de Phaser
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 800 },
                    debug: false // Cambiar a true si se necesita ver las hitboxes
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // Variables globales del juego
        let player;
        let cursors;
        let spaceKey;
        let platforms;
        let spikes;
        let star;
        let diamond;
        let boosters; // Grupo para multiples boosters
        
        // Variables para la logica del salto en combo
        let lastLandTime = 0;
        let wasOnGround = true;
        let canCombo = false;

        let isGameOver = false;

        function preload() {
            // Generamos las texturas programaticamente 
            let g = this.make.graphics({x: 0, y: 0, add: false});

            // 1. Textura del Jugador (Cuadrado Azul 32x32)
            g.fillStyle(0x3b82f6); // Tailwind blue-500
            g.fillRect(0, 0, 32, 32);
            g.generateTexture('player', 32, 32);
            g.clear();

            // 2. Textura del Bloque de Plataforma (40x40 - Marron con pasto verde)
            g.fillStyle(0x654321); // Marron
            g.fillRect(0, 0, 40, 40);
            g.fillStyle(0x4ade80); // Verde pasto
            g.fillRect(0, 0, 40, 8);
            g.generateTexture('block', 40, 40);
            g.clear();

            // 3. Textura de los Picos (Sin espacios, conectados perfectamente)
            g.fillStyle(0x808080); // Gris
            g.beginPath();

            // Primer pico (Cubre la mitad izquierda exacta: 0 a 20px)
            g.moveTo(10, 10);  // Punta
            g.lineTo(20, 20);  // Esquina inferior derecha
            g.lineTo(0, 20);   // Esquina inferior izquierda

            // Segundo pico (Cubre la mitad derecha exacta: 20 a 40px)
            g.moveTo(30, 10);  // Punta
            g.lineTo(40, 20);  // Esquina inferior derecha
            g.lineTo(20, 20);  // Esquina inferior izquierda

            g.closePath();
            g.fill();
            g.generateTexture('spike', 40, 20);
            g.clear();

            // 4. Textura de la Estrella (40x40)
            g.fillStyle(0xfacc15); // Amarillo
            g.beginPath();
            g.moveTo(20, 0); g.lineTo(26, 14); g.lineTo(40, 14); g.lineTo(29, 23);
            g.lineTo(33, 40); g.lineTo(20, 30); g.lineTo(7, 40); g.lineTo(11, 23);
            g.lineTo(0, 14); g.lineTo(14, 14); 
            g.closePath();
            g.fill();
            g.generateTexture('star', 40, 40);
            g.clear();

            // 5. Textura del Diamante (40x40)
            g.fillStyle(0x22d3ee); // Cyan
            g.beginPath();
            g.moveTo(20, 0); g.lineTo(40, 20); g.lineTo(20, 40); g.lineTo(0, 20);
            g.closePath();
            g.fill();
            g.generateTexture('diamond', 40, 40);
            g.clear();

            // 6. Textura del Booster/Trampolin (40x10)
            g.fillStyle(0x22c55e); // Verde brillante
            g.fillRect(0, 0, 40, 10);
            g.generateTexture('booster', 40, 10);
            g.clear();
        }

        function create() {
            isGameOver = false;
            
            // Color de fondo 
            this.cameras.main.setBackgroundColor('#87CEEB');

            // Nubes decorativas (Background)
            let graphics = this.add.graphics();
            graphics.fillStyle(0xffffff, 0.8);
            graphics.fillCircle(200, 150, 30); graphics.fillCircle(230, 150, 40); graphics.fillCircle(260, 150, 30);
            graphics.fillCircle(700, 100, 40); graphics.fillCircle(740, 100, 50); graphics.fillCircle(780, 100, 40);
            graphics.fillCircle(1200, 180, 35); graphics.fillCircle(1240, 180, 45); graphics.fillCircle(1280, 180, 35);
            graphics.fillCircle(1800, 120, 30); graphics.fillCircle(1830, 120, 40); graphics.fillCircle(1860, 120, 30);

            // Fondo negro para la seccion final/experta
            let bgDark = this.add.graphics();
            bgDark.fillStyle(0x1a202c, 1);
            bgDark.fillRect(1500, 0, 1000, 600); // Cubre la zona 3
            bgDark.setDepth(-1); // Asegura que quede detras de todo

            // Grupos fisicos
            platforms = this.physics.add.staticGroup();
            spikes = this.physics.add.staticGroup();
            boosters = this.physics.add.staticGroup();

            // ==========================================
            // CONSTRUCCION DEL NIVEL (Bloque = 40x40 px)
            // ==========================================
            
            // Funcion auxiliar para crear plataformas de 'n' bloques de ancho
            const createPlat = (startX, y, blocks) => {
                for(let i=0; i<blocks; i++) {
                    // +20 porque el origen de la textura en phaser es el centro (20,20)
                    platforms.create(startX + (i * 40) + 20, y + 20, 'block');
                }
            };
            
            // Funcion auxiliar para picos (hitbox ajustada a la fisica del salto)
            const createSpikes = (startX, y, blocks) => {
                for(let i=0; i<blocks; i++) {
                    let s = spikes.create(startX + (i * 40) + 20, y - 10, 'spike');
                    
                    // Reducimos radicalmente la caja de colision (hitbox)
                    // Ahora la zona que te mata mide solo 8px de ancho y 6px de alto
                    // y esta escondida en el mero centro del bloque de los picos.
                    s.body.setSize(8, 6);
                    s.body.setOffset(16, 14);
                }
            };

            // --- SECCION 1: TUTORIAL ---
            // Piso de seguridad para no caer al vacio en el tutorial
            createPlat(0, 560, 20); // 20 bloques (x: 0 a 800)

            // Boosters en el piso de abajo por si el jugador cae
            boosters.create(225, 555, 'booster'); 

            // Plataformas principales (y=400)
            createPlat(0, 400, 5);      // Piso inicial: 5 cuadritos (x: 0-200)
            createPlat(280, 400, 2);    // Espacio(2) -> Plat 1: 2 cuadritos (x: 280-360)
            createPlat(440, 400, 1);    // Espacio(2) -> Plat 2: 1 cuadrito (x: 440-480)
            createPlat(600, 400, 5);    // Espacio(3) -> Piso final: 5 cuadritos (x: 600-800)

            // --- SECCION 2: OBSTACULOS ---
            // Inicia en x=800 (continuacion directa)
            // Piso normal(3), Picos(2), Piso normal(3)
            createPlat(800, 400, 8); 
            createSpikes(920, 400, 1);  // Picos encima de los bloques 4 y 5

            // Hoyo / Vacio (2 bloques -> x: 1120 a 1200)
            
            // Piso normal(3), Picos(2), Piso normal(3)
            createPlat(1200, 400, 8);
            createSpikes(1320, 400, 1); // Picos encima de los bloques 4 y 5

            // --- SECCION 3: CAMINOS ALTERNATIVOS ---
            // Inicia en x=1520
            
            // Camino Normal (y=400)
            createPlat(1520, 400, 5);   // Piso inicial: 5 cuadritos (x: 1520-1720)
            
            // Booster colocado en el bloque 3 del piso inicial normal (x = 1520 + 2*40 = 1600)
            boosters.create(1620, 395, 'booster'); 
            
            createPlat(1800, 400, 3);   // Espacio(2) -> Plat 1: 3 cuadritos (x: 1800-1920)
            createPlat(2000, 400, 3);   // Espacio(2) -> Plat 2: 3 cuadritos (x: 2000-2120)
            createPlat(2200, 400, 5);   // Espacio(2) -> Piso final: 5 cuadritos (x: 2200-2400)
            
            // Estrella amarilla al final del camino normal
            star = this.physics.add.staticSprite(2360, 380, 'star');

            // Camino Experto (y=200)
            // Comienza tras usar el booster (x=1680)
            createPlat(1680, 200, 2);   // Piso inicial: 2 cuadritos (x: 1680-1760)
            createPlat(1840, 200, 1);   // Espacio(2) -> Plat 1: 1 cuadrito (x: 1840-1880)
            createPlat(2000, 200, 5);   // Espacio(3) -> Piso final: 5 cuadritos (x: 2000-2200)
            
            // Diamante azul al final del camino experto
            diamond = this.physics.add.staticSprite(2160, 180, 'diamond');
            // Nota: Tras agarrar el diamante en x=2200, el jugador cae al piso normal en x=2200.

            // ==========================================
            // JUGADOR Y FISICAS
            // ==========================================
            player = this.physics.add.sprite(60, 350, 'player');
            player.setBounce(0);
            
            // Limites del mundo virtual (no limitamos abajo para que pueda caer por el hoyo)
            this.physics.world.setBounds(0, 0, 2500, 1000);
            this.cameras.main.setBounds(0, 0, 2500, 600);
            this.cameras.main.startFollow(player, true, 0.08, 0.08);

            // Controles
            cursors = this.input.keyboard.createCursorKeys();
            spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

            // Colisiones
            this.physics.add.collider(player, platforms);
            
            // Colision con Picos -> Reinicia Nivel
            this.physics.add.collider(player, spikes, hitObstacle, null, this);
            
            // Colision con Boosters (Trampolines)
            this.physics.add.overlap(player, boosters, triggerBooster, null, this);
            
            // Colision con Coleccionables
            this.physics.add.overlap(player, star, collectStar, null, this);
            this.physics.add.overlap(player, diamond, collectDiamond, null, this);
        }

        function update(time, delta) {
            if (isGameOver) return;

            // Prevenir salir del mapa por la izquierda
            if (player.x < 16) player.x = 16;
            
            // Caer al vacio -> Reiniciar Nivel
            if (player.y > 650) {
                hitObstacle.call(this);
            }

            // Movimiento horizontal
            const speed = 135;
            if (cursors.left.isDown) {
                player.setVelocityX(-speed);
            } else if (cursors.right.isDown) {
                player.setVelocityX(speed);
            } else {
                player.setVelocityX(0);
            }

            // --- LOGICA DE SALTO Y DOBLE SALTO ---
            const onGround = player.body.blocked.down || player.body.touching.down;
            const jumpPressed = Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(spaceKey);
            
            // Detectar el momento exacto en que aterriza en el suelo
            if (onGround && !wasOnGround) {
                lastLandTime = time;
            }
            wasOnGround = onGround;

            // Solo se permite saltar si esta tocando el suelo
            if (jumpPressed && onGround) {
                let timeSinceLand = time - lastLandTime;
                
                // Si salto casi inmediatamente tras aterrizar (menos de 250ms) y el combo esta listo
                if (timeSinceLand < 250 && canCombo) {
                    player.setVelocityY(-480); // Salto de Combo (3 bloques)
                    canCombo = false;          // Se gasta el combo, el siguiente sera normal
                    
                    player.setTint(0xffea00);  // Efecto visual dorado
                    this.time.delayedCall(400, () => { if(player) player.clearTint(); });
                } else {
                    player.setVelocityY(-250); // Salto Normal (2 bloques)
                    canCombo = true;           // Prepara el combo para cuando vuelva a caer
                }
            }
        }

        function hitObstacle(playerObj, spikeObj) {
            if(isGameOver) return;
            isGameOver = true;
            this.physics.pause();
            player.setTint(0xff0000);
            
            // Breve pausa antes de reiniciar
            this.time.delayedCall(500, () => {
                this.scene.restart();
            });
        }

        function triggerBooster(playerObj, boosterObj) {
            // Solo impulsar si el jugador esta cayendo sobre el (o cerca del centro)
            if (playerObj.body.velocity.y >= 0) {
                playerObj.setVelocityY(-650); // Gran salto hacia el camino experto
            }
        }

        function collectStar(playerObj, starObj) {
            if(isGameOver) return;
            isGameOver = true;
            this.physics.pause();
            starObj.destroy();
            
            // Texto de victoria
            const cam = this.cameras.main;
            const winText = this.add.text(cam.scrollX + 400, 300, 'LEVEL COMPLETED!', {
                fontSize: '48px',
                fill: '#ffffff',
                fontStyle: 'bold',
                stroke: '#000000',
                strokeThickness: 6
            });
            winText.setOrigin(0.5);
            
            // Efecto visual de particulas/destello (simulado con color de fondo momentaneo)
            this.cameras.main.flash(1000, 255, 215, 0);
        }

        function collectDiamond(playerObj, diamondObj) {
            diamondObj.destroy();
            this.cameras.main.flash(300, 0, 255, 255);
            
            // Mostrar +500 points flotantes
            const floatText = this.add.text(playerObj.x, playerObj.y - 40, '+500', {
                fontSize: '20px',
                fill: '#00ffff',
                stroke: '#000',
                strokeThickness: 3
            }).setOrigin(0.5);

            this.tweens.add({
                targets: floatText,
                y: playerObj.y - 80,
                alpha: 0,
                duration: 1000,
                onComplete: () => floatText.destroy()
            });
        }
    </script>
</body>
</html>
